name: Native calculator validation

on:
  push:
    paths:
      - "scripts/vedic_native_calculator.py"
      - "scripts/chart_sanity_check.py"
      - "tests/test_native_calculator.py"
      - ".github/workflows/native-calculator.yml"
  pull_request:
    paths:
      - "scripts/vedic_native_calculator.py"
      - "scripts/chart_sanity_check.py"
      - "tests/test_native_calculator.py"
      - ".github/workflows/native-calculator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: SAV/BAV regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install calculator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-native-calculator.txt
      - name: Compile calculator modules
        run: python -m py_compile scripts/vedic_native_calculator.py scripts/chart_sanity_check.py scripts/jhora_markdown_bridge.py
      - name: Verify PyJHora calendar bridge
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from vedic_native_calculator import BirthInput, configure_pyjhora, pyjhora_julian_day
          birth = BirthInput(2002, 12, 11, 20, 47, 25.4333, 119.0, "Asia/Shanghai", "Quanzhou")
          Date, _Place, _charts, _ashtakavarga, utils = configure_pyjhora()
          jd = pyjhora_julian_day(birth, Date, utils)
          print(f"PyJHora local JD={jd:.6f}")
          assert 2_000_000 < jd < 3_000_000, jd
          import inspect
          from jhora.panchanga import drik
          print(inspect.getsource(drik.dhasavarga))
          PY
      - name: Run direct SAV/BAV regression
        run: python -m unittest discover -s tests -p "test_native_calculator.py" -v
      - name: Verify the generated JSON through the shared sanity checker
        run: |
          mkdir -p .tmp
          python scripts/vedic_native_calculator.py --date 2002-12-11 --time 20:47 --lat 25.4333 --lon 119.0 --tz Asia/Shanghai --place Quanzhou --output .tmp/native.md --json-output .tmp/native.json --require-ashtakavarga
          python scripts/chart_sanity_check.py .tmp/native.json
